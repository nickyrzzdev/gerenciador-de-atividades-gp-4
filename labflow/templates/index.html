<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabFlow UEA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #e2e8f0;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 3rem 3.5rem;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        h1 { font-size: 2.2rem; letter-spacing: 0.5px; }
        h1 span { color: #60a5fa; }
        p { margin-top: 0.75rem; color: #94a3b8; }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            border-radius: 999px;
            background: rgba(96, 165, 250, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lab<span>Flow</span> UEA</h1>
        <p>Gestão de projetos e entregas acadêmicas</p>
        <div class="badge">Tela de exemplo &middot; em construção</div>
    </div>
</body>
</html>
